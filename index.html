<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Tempero Secreto Marmitaria</title>
    <!-- Tailwind CSS para um design limpo e moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- CABEÇALHO -->
    <header class="bg-red-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-bold tracking-wide">🍲 Tempero Secreto — CRM</span>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-4">
                <span id="user-email-display" class="text-sm bg-red-800 px-3 py-1 rounded-full"></span>
                <button onclick="logout()" class="bg-red-900 hover:bg-red-950 text-white text-sm px-3 py-1.5 rounded transition">Sair</button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">

        <!-- TELA DE LOGIN / AUTENTICAÇÃO -->
        <section id="auth-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md mt-12">
            <h2 class="text-2xl font-bold text-center text-red-700 mb-6">Acesso ao Sistema</h2>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Palavra-passe (Senha)</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-lg transition">Entrar</button>
            </form>
            <div id="auth-error" class="mt-4 text-red-600 text-sm text-center hidden"></div>
        </section>

        <!-- TELA DO PAINEL DO CRM (Oculto até fazer login) -->
        <section id="dashboard-section" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h1 class="text-xl font-bold text-slate-800">Painel de Empresas e Clientes</h1>
                <button onclick="openCompanyModal()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">+ Nova Empresa</button>
            </div>

            <!-- TABELA DE EMPRESAS -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                                <th class="p-4">Nome / Empresa</th>
                                <th class="p-4">Contacto</th>
                                <th class="p-4">Telefone</th>
                                <th class="p-4">Status / Detalhes</th>
                            </tr>
                        </thead>
                        <tbody id="companies-table-body" class="divide-y divide-slate-200 text-sm">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL DE CADASTRO DE EMPRESA -->
    <div id="company-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800">Registar Nova Empresa / Cliente</h3>
            <form id="company-form" onsubmit="saveCompany(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nome da Empresa / Cliente</label>
                    <input type="text" id="comp-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Contacto</label>
                    <input type="text" id="comp-contact" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Telefone / WhatsApp</label>
                    <input type="text" id="comp-phone" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Observações</label>
                    <textarea id="comp-notes" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeCompanyModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium rounded-lg">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-medium rounded-lg">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="text-center py-4 text-xs text-slate-500">
        Tempero Secreto Marmitaria — CRM Interno &copy; 2026
    </footer>

    <!-- LÓGICA DO SUPABASE E APLICAÇÃO -->
    <script>
        // Credenciais fornecidas do Supabase
        const SUPABASE_URL = 'https://inutdzwmcursufeugtue.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_X3-P0XBkYjl7iFOu8tjhRA_RCJLcj2F';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Verificar sessão ao carregar a página
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showDashboard(session.user);
            }
        });

        // Função de Login
        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('auth-error');

            errorDiv.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorDiv.textContent = 'Erro ao entrar: ' + error.message;
                errorDiv.classList.remove('hidden');
            } else {
                showDashboard(data.user);
            }
        }

        // Mostrar Painel
        function showDashboard(user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-email-display').textContent = user.email;
            loadCompanies();
        }

        // Logout
        async function logout() {
            await supabaseClient.auth.signOut();
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
        }

        // Carregar Empresas da base de dados
        async function loadCompanies() {
            const tbody = document.getElementById('companies-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">A carregar dados...</td></tr>';

            const { data, error } = await supabaseClient
                .from('companies')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-600">Erro ao carregar: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">Nenhuma empresa registada ainda.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach(comp => {
                // Adaptável caso os nomes das colunas variem ligeiramente
                const name = comp.name || comp.nome || 'Sem nome';
                const contact = comp.contact_person || comp.contato || comp.contact || '-';
                const phone = comp.phone || comp.telefone || '-';
                const notes = comp.notes || comp.observacoes || '';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 border-b border-slate-100">
                        <td class="p-4 font-medium text-slate-900">${escapeHtml(name)}</td>
                        <td class="p-4 text-slate-600">${escapeHtml(contact)}</td>
                        <td class="p-4 text-slate-600">${escapeHtml(phone)}</td>
                        <td class="p-4 text-slate-500 text-xs">${escapeHtml(notes)}</td>
                    </tr>
                `;
            });
        }

        // Gestão da Modal
        function openCompanyModal() {
            document.getElementById('company-modal').classList.remove('hidden');
        }

        function closeCompanyModal() {
            document.getElementById('company-modal').classList.add('hidden');
            document.getElementById('company-form').reset();
        }

        // Guardar Empresa
        async function saveCompany(event) {
            event.preventDefault();
            const name = document.getElementById('comp-name').value;
            const contact = document.getElementById('comp-contact').value;
            const phone = document.getElementById('comp-phone').value;
            const notes = document.getElementById('comp-notes').value;

            // Insere na tabela 'companies' do Supabase
            const { error } = await supabaseClient
                .from('companies')
                .insert([{ name, contact_person: contact, phone, notes }]);

            if (error) {
                alert('Erro ao guardar empresa: ' + error.message);
            } else {
                closeCompanyModal();
                loadCompanies();
            }
        }

        // Segurança simples contra HTML injection
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
